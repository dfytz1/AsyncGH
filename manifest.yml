name: AsyncGH
version: 1.3.0
authors:
  - dfytz1
description: >
  Keep Grasshopper's UI fully responsive while solutions run.
  Supports canvas navigation, component moving, saving, clusters,
  MessageBox/GetObject components, a top progress bar (teal + magenta) during computation,
  and optional deferred first solve on file open (EnableSolutions) for faster large-definition loads.
url: https://github.com/dfytz1/AsyncGH
keywords:
  - async
  - performance
  - grasshopper
  - ui
icon: icon.png
